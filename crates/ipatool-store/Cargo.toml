[package]
name = "ipatool-store"
description = "Apple Store framework emulator: Objective-C/Swift runtime bridge over the SAP guest"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
base64 = "0.23"
crc32fast = "1"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
getrandom = "0.3"
ipatool-sap.workspace = true
plist = "1.10"
regex = "1"
reqwest = { workspace = true, features = ["blocking", "cookies"] }
ruzstd = "0.9"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true
unicode-normalization = "0.1"
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_aarch64"] }
url.workspace = true

[lints]
workspace = true
