[package]
name = "ipatool-cli"
description = "ipatool command line interface"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "ipatool"
path = "src/main.rs"

[dependencies]
clap.workspace = true
futures-util = { version = "0.3", default-features = false }
ipatool-appstore.workspace = true
ipatool-keychain.workspace = true
ipatool-store.workspace = true
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-io"] }
schemars = "1.2"
serde.workspace = true
serde_json.workspace = true
time = { workspace = true, features = ["local-offset"] }
tokio = { workspace = true, features = ["io-std", "io-util", "signal", "sync"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["termios"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["fs", "pty", "termios"] }

[lints]
workspace = true
