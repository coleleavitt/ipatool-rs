[package]
name = "ipatool-sap"
description = "Apple SAP signing: Unicorn arm64 guest running Apple's frameworks"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
aes = "0.9"
base64 = "0.23"
ctr = "0.10"
getrandom = "0.3"
hkdf = "0.13"
hmac = "0.13"
hpke = { version = "0.15", default-features = false, features = ["alloc", "aes", "nistp"] }
lzfse = "0.2"
object = { version = "0.41", default-features = false, features = ["read_core", "macho", "std"] }
p256 = { version = "0.14", features = ["pkcs8", "pem"] }
plist = "1.10"
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
tempfile = "3"
thiserror.workspace = true
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_aarch64"] }
url.workspace = true
zip = { version = "9.8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
