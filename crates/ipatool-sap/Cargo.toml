[package]
name = "ipatool-sap"
description = "Apple SAP signing: Unicorn arm64 guest running Apple's frameworks"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
aes = "0.9"
base64 = "0.23"
ctr = "0.10"
hkdf = "0.13"
hmac = "0.13"
hpke = { version = "0.15", default-features = false, features = ["alloc", "aes", "nistp"] }
lzfse = "0.2"
p256 = { version = "0.14", features = ["pkcs8", "pem"] }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
tempfile = "3"
thiserror.workspace = true
url = { workspace = true }
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_aarch64"] }
zip = { version = "9.8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
