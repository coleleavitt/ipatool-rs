[package]
name = "ipatool-keychain"
description = "Credential storage compatible with the Go ipatool keyring (Secret Service, Apple Keychain, encrypted files)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
aes-gcm = "0.11"
aes-kw = "0.3"
base64 = "0.23"
getrandom = "0.3"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true
time.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
secret-service = { version = "5.2", features = ["rt-tokio-crypto-rust"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3.7"

[target.'cfg(target_os = "ios")'.dependencies]
core-foundation = "0.10"

[dev-dependencies]
tempfile = "3"
tokio.workspace = true

[lints]
workspace = true
