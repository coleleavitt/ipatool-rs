[package]
name = "ipatool-appstore"
description = "App Store client: catalog, auth, purchase and download"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
base64 = "0.23"
bzip2 = "0.6"
cookie = "0.18"
crc32fast = "1"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
getrandom = "0.3"
hyper = "1"
ipatool-keychain.workspace = true
ipatool-sap.workspace = true
ipatool-store.workspace = true
md-5 = "0.11"
plist = "1.10"
psl = "2"
regex = "1"
reqwest = { workspace = true, features = ["cookies"] }
roxmltree = "0.21"
rustix = { version = "1", features = ["fs"] }
# Only to recognize reqwest's unknown-issuer TLS error; same version reqwest links.
rustls = { version = "0.23", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3"
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
url.workspace = true
x509-cert = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "net"] }
webpki-root-certs = "1"

[lints]
workspace = true
