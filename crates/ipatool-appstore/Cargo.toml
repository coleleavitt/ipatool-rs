[package]
name = "ipatool-appstore"
description = "App Store client: catalog, auth, purchase and download"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
base64 = "0.23"
cookie = "0.18"
getrandom = "0.3"
hyper = "1"
ipatool-keychain.workspace = true
ipatool-sap.workspace = true
ipatool-store.workspace = true
plist = "1.10"
psl = "2"
regex = "1"
reqwest = { workspace = true, features = ["cookies"] }
rustix = { version = "1", features = ["fs"] }
# Only to recognize reqwest's unknown-issuer TLS error; same version reqwest links.
rustls = { version = "0.23", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["time"] }
url.workspace = true
x509-cert = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["io-util", "net"] }
webpki-root-certs = "1"

[lints]
workspace = true
