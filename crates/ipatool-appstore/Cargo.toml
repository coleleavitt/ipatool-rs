[package]
name = "ipatool-appstore"
description = "App Store client: catalog, auth, purchase and download"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
base64 = "0.23"
bzip2 = "0.6"
cookie = "0.18"
crc32fast = "1"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
getrandom = "0.3"
hyper = "1"
ipatool-keychain.workspace = true
ipatool-sap.workspace = true
ipatool-store.workspace = true
md-5 = "0.11"
plist = "1.10"
psl = "2"
regex = "1"
reqwest = { workspace = true, features = ["cookies"] }
roxmltree = "0.21"
# Only to recognize reqwest's unknown-issuer TLS error; same version reqwest links.
rustls = { version = "0.23", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3"
thiserror.workspace = true
time = { workspace = true, features = ["local-offset"] }
tokio = { workspace = true, features = ["sync", "time"] }
url.workspace = true
x509-cert = "0.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(any(target_vendor = "apple", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd", target_os = "dragonfly"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "net"] }
webpki-root-certs = "1"

[lints]
workspace = true
