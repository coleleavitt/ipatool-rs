[package]
name = "ipatool-profilegen"
description = "Regenerates the Store profile from the pinned Apple binaries under Unicorn"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "profilegen"
path = "src/main.rs"

[dependencies]
clap.workspace = true
ipatool-sap.workspace = true
ipatool-store.workspace = true
plist = "1.10"
ruzstd = "0.9"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_aarch64"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
