name: Unit Tests

on:
  pull_request:
    branches:
      - main

jobs:
  run_tests:
    name: Run tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # Offline tests only; the live tests are #[ignore] and need an Apple account.
      - run: cargo test --workspace --locked
