[workspace]
members = ["crates/ipatool-appstore", "crates/ipatool-cli", "crates/ipatool-keychain", "crates/ipatool-sap", "crates/ipatool-store"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/coleleavitt/ipatool-rs"
rust-version = "1.100"
version = "0.1.0"

[workspace.dependencies]
ipatool-appstore = { path = "crates/ipatool-appstore" }
ipatool-keychain = { path = "crates/ipatool-keychain" }
ipatool-sap = { path = "crates/ipatool-sap" }
ipatool-store = { path = "crates/ipatool-store" }
clap = { version = "4.6", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
